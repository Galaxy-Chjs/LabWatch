name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and dev dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check labwatch tests

      - name: Check relative imports resolve
        run: python scripts/check-imports.py labwatch

      - name: Check the Python 3.10 syntax floor
        run: python scripts/check-syntax-floor.py labwatch 3.10

      # A workflow that names a path a refactor deleted fails as "file not found",
      # which reads like a code problem. This caught `ruff check labwatch backend`
      # after backend/ was removed.
      - name: Check workflow paths exist
        run: python scripts/check-workflow-paths.py

      - name: Run tests
        run: pytest -q --cov=labwatch --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage.xml
          if-no-files-found: ignore

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npx tsc -b

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build

      # The built dashboard is committed under labwatch/ui so `uvx labwatch`
      # works without Node. That only holds if the committed bundle matches the
      # sources it was built from, so fail loudly when they drift.
      - name: The committed dashboard must match the sources it was built from
        run: |
          if [ -n "$(git status --porcelain -- ../labwatch/ui)" ]; then
            echo "::error::labwatch/ui is out of date. Run 'npm run build' in frontend/ and commit the result."
            git --no-pager diff --stat -- ../labwatch/ui
            exit 1
          fi
          echo "labwatch/ui is in sync with the frontend sources."

  package:
    name: Build and install the wheel
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build the wheel
        run: |
          pip install --quiet build
          python -m build --wheel --outdir dist

      # Installing the wheel into a clean environment and serving from it is the
      # promise made by `uvx labwatch`, so verify it here rather than assuming.
      - name: The wheel must contain and serve the dashboard
        run: |
          set -euo pipefail
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet dist/*.whl
          /tmp/venv/bin/python - <<'PY'
          import pathlib, labwatch
          index = pathlib.Path(labwatch.__file__).parent / "ui" / "index.html"
          assert index.is_file(), f"dashboard missing from the wheel: {index}"
          print("bundled dashboard present:", index.stat().st_size, "bytes")
          PY
          /tmp/venv/bin/labwatch version
          /tmp/venv/bin/labwatch doctor --json > /tmp/doctor.json || true
          /tmp/venv/bin/python -c "import json;d=json.load(open('/tmp/doctor.json'));print('doctor ready:',d['ready'])"
          # Start it in demo mode and require a 200 from the served UI.
          LABWATCH_DATA_DIR=/tmp/lwdata /tmp/venv/bin/labwatch serve --demo --no-browser --port 8123 &
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8123/api/health > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8123/api/health
          curl -fsS http://127.0.0.1:8123/ | grep -qi '<title>LabWatch'
          echo "wheel serves the dashboard correctly"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: labwatch-wheel
          path: dist/*.whl
          if-no-files-found: error

  extension:
    name: VS Code extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vscode-extension/package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Compile (type check)
        run: npm run compile

      # The formatting and parsing layer has no vscode imports, so it runs under
      # plain Node. That is deliberate: it is where a wrong number would show up.
      - name: Unit tests
        run: npm test

      - name: Package the extension
        run: npx --yes @vscode/vsce package --no-dependencies

      - uses: actions/upload-artifact@v4
        with:
          name: labwatch-vsix
          path: vscode-extension/*.vsix
          if-no-files-found: error

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: pip install -e ".[dev]"

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
        working-directory: frontend

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      # The E2E suite starts the backend through python -m labwatch serve --demo,
      # so no NVIDIA GPU and no production build are required on the runner.
      - name: Run Playwright
        run: npx playwright test
        working-directory: frontend

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: labwatch:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container in demo mode
        run: |
          docker run -d --name labwatch-ci -p 8000:8000 \
            -e LABWATCH_DEMO_MODE=true \
            -e LABWATCH_HISTORY_INTERVAL=2 \
            labwatch:ci

      - name: Wait for health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/api/health > /dev/null; then
              echo "healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "container did not become healthy"
          docker logs labwatch-ci
          exit 1

      - name: Smoke test the API and the served dashboard
        run: |
          set -e
          curl -fsS http://localhost:8000/api/health | tee /dev/stderr | grep -q '"status":"ok"'
          curl -fsS http://localhost:8000/api/overview | grep -q '"gpus"'
          curl -fsS http://localhost:8000/ | grep -qi '<title>LabWatch'

      - name: Container logs
        if: always()
        run: docker logs labwatch-ci

      - name: Stop container
        if: always()
        run: docker rm -f labwatch-ci
